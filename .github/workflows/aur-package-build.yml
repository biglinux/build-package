name: 🧰 AUR Package Build

on:
  # Only AUR requests (aur-<package>); package builds go to build-package.yml.
  repository_dispatch:
    types: ["aur-*"]
  workflow_dispatch:
    inputs:
      package_name:
        description: AUR package name
        required: true
        type: string
      aur_url:
        description: AUR Git URL
        required: true
        type: string
      pacman_mirror:
        description: Optional complete Manjaro mirror URL
        required: false
        type: string
      aur_commit:
        description: Build exactly this AUR commit (40-char hash, as reviewed)
        required: false
        type: string
      pkgrel:
        description: Rebuild the same AUR version with this pkgrel (e.g. 4.1)
        required: false
        type: string
      push_to_repo:
        description: Upload to the BigLinux package repository
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      update_db:
        description: Update repository database
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  package:
    # The reusable pipeline's publish job declares contents: write; a caller
    # that grants less makes GitHub refuse to start the run (startup failure).
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.action, 'aur-') }}
    uses: ./.github/workflows/_secure-package-pipeline.yml
    with:
      build_env: aur
      branch_type: aur
      package_name: ${{ github.event_name == 'workflow_dispatch' && inputs.package_name || github.event.client_payload.package_name }}
      source_url: ${{ github.event_name == 'workflow_dispatch' && inputs.aur_url || github.event.client_payload.aur_url }}
      manjaro_branch: stable
      pacman_mirror: ${{ github.event_name == 'workflow_dispatch' && inputs.pacman_mirror || github.event.client_payload.pacman_mirror || '' }}
      builder_image: ${{ vars.BIGLINUX_BUILDER_IMAGE || 'talesam/community-build:latest' }}
      aur_commit: ${{ github.event_name == 'workflow_dispatch' && inputs.aur_commit || github.event.client_payload.aur_commit || '' }}
      aur_pkgrel: ${{ github.event_name == 'workflow_dispatch' && inputs.pkgrel || github.event.client_payload.pkgrel || '' }}
      publish_github: ${{ 'false' }}
      push_to_repo: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_repo || 'true' }}
      update_db: ${{ github.event_name == 'workflow_dispatch' && inputs.update_db || 'true' }}
