name: Validate package pipeline

on:
  pull_request:
    paths:
      - .github/workflows/**
      - action.yml
      - scripts/**
  push:
    paths:
      - .github/workflows/**
      - action.yml
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Validate workflows and scripts
        run: |
          actionlint
          shellcheck scripts/*.sh
          bash -n scripts/*.sh
