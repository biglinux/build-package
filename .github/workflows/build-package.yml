name: 📦 Build Package

on:
  # Every package request except AUR ones (aur-<package>, handled by
  # aur-package-build.yml): without this filter one request started both.
  repository_dispatch:
    types:
      - "*"
      - "!aur-*"
  workflow_dispatch:
    inputs:
      package_name:
        description: Package name
        required: true
        type: string
      source_url:
        description: HTTPS GitHub repository containing the PKGBUILD
        required: true
        type: string
      branch_type:
        description: Destination repository branch
        required: true
        type: choice
        options: [testing, stable, priority, extra]
      source_branch:
        description: Source Git branch (optional)
        required: false
        type: string
      new_branch:
        description: BigLinux testing source branch (optional)
        required: false
        type: string
      pkgbuild_path:
        description: Directory containing PKGBUILD when the repository has more than one
        required: false
        type: string
      manjaro_branch:
        description: Manjaro branch used for the rolling update
        required: true
        default: stable
        type: choice
        options: [stable, testing, unstable]
      pacman_mirror:
        description: Optional complete Manjaro mirror URL
        required: false
        type: string
      release_repository:
        description: Optional owner/repository for the GitHub release
        required: false
        type: string
      publish_github:
        description: Publish a GitHub release
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      push_to_repo:
        description: Upload to the BigLinux package repository
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      update_db:
        description: Update repository database
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  package:
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.action, 'aur-') }}
    uses: ./.github/workflows/_secure-package-pipeline.yml
    # A reusable workflow receives no secrets unless the caller passes them:
    # without this the GPG key, the SSH key and the server arrived empty.
    secrets: inherit
    with:
      build_env: ${{ github.event_name == 'workflow_dispatch' && inputs.branch_type || github.event.client_payload.branch_type || 'testing' }}
      branch_type: ${{ github.event_name == 'workflow_dispatch' && inputs.branch_type || github.event.client_payload.branch_type || 'testing' }}
      package_name: ${{ github.event_name == 'workflow_dispatch' && inputs.package_name || github.event.client_payload.package_name || github.event.action }}
      source_url: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url || github.event.client_payload.url }}
      source_branch: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_branch || inputs.new_branch) || github.event.client_payload.source_branch || github.event.client_payload.branch || '' }}
      new_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.new_branch || github.event.client_payload.branch || '' }}
      # gitrepo sends pkgbuild_dir (multi-package repositories)
      pkgbuild_path: ${{ github.event_name == 'workflow_dispatch' && inputs.pkgbuild_path || github.event.client_payload.pkgbuild_path || github.event.client_payload.pkgbuild_dir || '' }}
      manjaro_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.manjaro_branch || github.event.client_payload.manjaro_branch || 'stable' }}
      pacman_mirror: ${{ github.event_name == 'workflow_dispatch' && inputs.pacman_mirror || github.event.client_payload.pacman_mirror || '' }}
      builder_image: ${{ vars.BIGLINUX_BUILDER_IMAGE || 'talesam/community-build:latest' }}
      publish_github: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_github || 'true' }}
      push_to_repo: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_repo || 'true' }}
      update_db: ${{ github.event_name == 'workflow_dispatch' && inputs.update_db || 'true' }}
      release_repository: ${{ github.event_name == 'workflow_dispatch' && inputs.release_repository || github.event.client_payload.release_repository || '' }}
