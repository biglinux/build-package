name: Secure BigLinux Package Build
description: Builds an unsigned Arch/Manjaro package in a secret-free job

inputs:
  build_env:
    description: "Build environment: stable, testing, extra or aur"
    required: true
  branch_type:
    description: "Destination branch: stable, testing, extra or aur"
    required: true
  package_name:
    description: Package name
    required: true
  url:
    description: Git repository containing the PKGBUILD
    required: true
  git_branch:
    description: Source Git branch
    required: false
  new_branch:
    description: BigLinux testing source branch
    required: false
  manjaro_branch:
    description: Manjaro branch used by pacman
    required: false
    default: stable
  pacman_mirror:
    description: Optional complete Manjaro mirror URL
    required: false
  pkgbuild_path:
    description: Directory containing PKGBUILD, relative to the source repository
    required: false
  aur_commit:
    description: AUR only - build exactly this commit of the AUR repository (the one Repo Management reviewed)
    required: false
    default: ""
  aur_pkgrel:
    description: AUR only - pkgrel to build with (e.g. 4.1), to rebuild the same AUR version so pacman upgrades it
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build unsigned package
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.build_env }}
        BRANCH_TYPE: ${{ inputs.branch_type }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        SOURCE_URL: ${{ inputs.url }}
        SOURCE_BRANCH: ${{ inputs.git_branch }}
        NEW_BRANCH: ${{ inputs.new_branch }}
        MANJARO_BRANCH: ${{ inputs.manjaro_branch }}
        PACMAN_MIRROR: ${{ inputs.pacman_mirror }}
        PKGBUILD_PATH: ${{ inputs.pkgbuild_path }}
        AUR_COMMIT: ${{ inputs.aur_commit }}
        AUR_PKGREL: ${{ inputs.aur_pkgrel }}
        DIST_DIR: ${{ github.workspace }}/dist
      run: bash "$GITHUB_ACTION_PATH/scripts/build-package.sh"
